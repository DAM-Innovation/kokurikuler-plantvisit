<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>Kolaborasi Plant Visit</title>
<style>
:root{--p:#0f766e;--bg:#f2f6f5;--c:#fff;--t:#1b2b2a;--m:#64748b;--l:#d9e3e1}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--c);padding:6px 12px;border-bottom:1px solid var(--l)}
nav button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--m);cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:#e0f2f1;color:var(--p);font-weight:600}
main{max-width:980px;margin:16px auto;padding:0 12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px}.m{color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:8px;font:inherit;margin:4px 0 10px;background:#fff}
.btn{background:var(--p);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font:inherit;margin-right:6px}
.btn.g{background:#fff;color:var(--p);border:1px solid var(--p)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--l)}
.seg{display:flex;gap:4px}.seg input{display:none}
.seg span{display:block;width:40px;text-align:center;padding:7px 0;border:1px solid var(--l);border-radius:8px;cursor:pointer}
.seg input:checked+span{background:var(--p);color:#fff;border-color:var(--p)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--l);padding:7px;text-align:left;vertical-align:top}
tr.k{cursor:pointer}tr.k:hover{background:#f2f6f5}
.b{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}.w{overflow-x:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1b2b2a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
</style></head><body>
<div id="lg" class="card" style="max-width:340px;margin:12vh auto">
  <div style="color:var(--p);text-align:center" id="lg1"></div>
  <h3 style="text-align:center">Kolaborasi Plant Visit</h3>
  <p class="m" style="text-align:center">SMK SMTI Padang · TA 2026/2027</p>
  <label>ID / NIS</label><input id="u" autocomplete="username">
  <label>PIN</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
  <button class="btn" style="width:100%" onclick="doLogin()">Masuk</button>
</div>
<div id="app" hidden>
  <header><span id="lg2"></span><b>Kolaborasi Plant Visit</b><span id="who" style="margin-left:auto"></span><button class="btn g" onclick="out()">Keluar</button></header>
  <nav id="nv"></nav><main id="mn"></main>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let T,ME,CFG,TIM=[],MINE,GR=[],REK=[];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KN=['Kerja sama','Komunikasi','Kepedulian','Tanggung jawab bersama','Penyelesaian konflik'];
const TH=['Team building (10 Des)','Perjalanan Padang-Jakarta (13-14 Des)','Fun Day (15 Des)','Mayora & gala dinner (16 Des)','Pabrik Tangerang (17 Des)','Perjalanan pulang (18-19 Des)','Laporan & seminar'];
const PC={'Sangat Baik':'#0f766e','Baik':'#2563eb','Cukup':'#d97706','Perlu Bimbingan':'#dc2626','Belum ada data':'#94a3b8'};
const LOGO='<svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="14" cy="14" r="4"/><circle cx="5" cy="7" r="2.5"/><circle cx="23" cy="7" r="2.5"/><circle cx="5" cy="21" r="2.5"/><circle cx="23" cy="21" r="2.5"/><path d="M7 8.5l4 3.5M21 8.5l-4 3.5M7 19.5l4-3.5M21 19.5l-4-3.5"/></svg>';
$('#lg1').innerHTML=LOGO;$('#lg2').innerHTML=LOGO;
const IC={tugas:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',diri:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',catatan:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z',teman:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',obs:'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 2h6v4H9z',produk:'M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z',rekap:'M18 20V10M12 20V4M6 20v-6',impor:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',setting:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',rubrik:'M3 3h18v18H3zM3 9h18M9 21V9'};
const LB={tugas:'Tugas saya',diri:'Penilaian diri',catatan:'Jurnal & catatan',teman:'Teman sebaya',obs:'Observasi',produk:'Produk kelompok',rekap:'Rekap & predikat',impor:'Impor data',setting:'Pengaturan',rubrik:'Rubrik'};
const NAV={siswa:['tugas','diri','catatan','teman','rubrik'],guru:['obs','produk','rekap','rubrik'],admin:['rekap','obs','produk','impor','setting','rubrik']};
const API_URL='https://script.google.com/macros/s/AKfycbzpnqhFUZueGXq4jywbp7VTdUw6tsO-loIng6kqVIvjQWD5xrlG8WVR3IGZ-uDLVAqy/exec';
async function call(b){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});const d=await r.json();if(d.error)throw new Error(d.error);return d.data}
const api=(a,p)=>call({fn:'api',t:T,a,p:p||{}}).catch(e=>{if(/SESI/.test(e.message))out();throw e});
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'#b91c1c':'#1b2b2a';t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function out(){T=null;$('#app').hidden=true;$('#lg').style.display='block'}
async function doLogin(){
  try{const r=await call({fn:'login',id:$('#u').value,pin:$('#p').value});
  if(!r)return toast('ID atau PIN salah',1);T=r.token;await sync();
  $('#lg').style.display='none';$('#app').hidden=false;$('#who').textContent=ME.nama+' ('+ME.role+')';
  $('#nv').innerHTML=NAV[ME.role].map(k=>`<button id="n_${k}" onclick="go('${k}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>${LB[k]}</button>`).join('');
  go(NAV[ME.role][0]);}catch(e){toast(e.message,1)}
}
async function sync(){const d=await api('me');ME=d.u;CFG=d.cfg;TIM=d.tim;MINE=d.mine;if(ME.role!='siswa')GR=await api('grup')}
async function go(k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n_'+k));$('#mn').innerHTML='<p class="m">Memuat…</p>';try{$('#mn').innerHTML=await V[k]()}catch(e){toast(e.message,1)}}
async function send(a,p,after){try{await api(a,p);toast('Tersimpan');await sync();after&&after()}catch(e){toast(e.message,1)}}
const fmt=x=>x==null?'-':x.toFixed(2);
const sc=p=>`<p class="m">1 Perlu Bimbingan · 2 Cukup · 3 Baik · 4 Sangat Baik</p>`+KN.map((n,i)=>`<div class="row"><span>${n}</span><span class="seg">${[1,2,3,4].map(v=>`<label><input type="radio" name="${p}${i}" value="${v}"><span>${v}</span></label>`).join('')}</span></div>`).join('');
const rd=p=>{const o={};for(let i=0;i<5;i++){const e=document.querySelector(`[name=${p}${i}]:checked`);if(!e)return null;o['K'+(i+1)]=+e.value}return o};
const opt=(a,sel)=>a.map(x=>`<option${x==sel?' selected':''}>${esc(x)}</option>`).join('');
const ok_=`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0f766e"/><path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>`;
const no_=`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#94a3b8" stroke-width="2"/></svg>`;
function radar(v,s=240){const c=s/2,r=s/2-40,pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[c+r*f*Math.cos(a),c+r*f*Math.sin(a)]},pl=f=>[0,1,2,3,4].map(i=>pt(i,f).join(',')).join(' ');
return`<svg viewBox="0 0 ${s} ${s}" width="${s}">${[.25,.5,.75,1].map(f=>`<polygon points="${pl(f)}" fill="none" stroke="#d9e3e1"/>`).join('')}<polygon points="${v.map((x,i)=>pt(i,(x||0)/4).join(',')).join(' ')}" fill="#0f766e55" stroke="#0f766e" stroke-width="2"/>${KN.map((n,i)=>{const[x,y]=pt(i,1.25);return`<text x="${x}" y="${y}" font-size="10" text-anchor="middle" fill="#64748b">${n.split(' ')[0]}</text>`}).join('')}</svg>`}
const V={};
V.tugas=()=>{const m=MINE,n=TIM.filter(x=>x.id!=ME.id).length,pe=r=>m.peer.filter(x=>x.putaran==r).length;
const it=(d,t)=>`<div class="row"><span>${d?ok_:no_} ${t}</span></div>`;
return`<div class="card"><h3>Halo, ${esc(ME.nama)}</h3><p class="m">Kelompok ${esc(ME.kelompok||'-')} · ${n+1} anggota</p>
${it(m.diri.includes('awal'),'Penilaian diri awal (10 Des)')}${it(m.catatan.some(x=>x.jenis=='Kontrak kolaborasi'),'Kontrak kolaborasi kelompok')}
${it(m.catatan.length>=6,'Jurnal harian ('+m.catatan.length+'/6 catatan)')}${it(n&&pe('awal')>=n,'Penilaian teman sebaya awal ('+pe('awal')+'/'+n+')')}
${it(m.diri.includes('akhir'),'Penilaian diri akhir')}${it(n&&pe('akhir')>=n,'Penilaian teman sebaya akhir ('+pe('akhir')+'/'+n+')')}
${it(m.catatan.some(x=>x.jenis=='Refleksi akhir'),'Refleksi akhir')}</div>`};
V.diri=()=>`<div class="card"><h3>Penilaian diri</h3><label>Waktu penilaian</label><select id="j"><option value="awal">Awal (10 Des)</option><option value="akhir">Akhir (setelah plant visit)</option></select>${sc('d')}<br><button class="btn" onclick="sDiri()">Simpan</button></div>`;
const sDiri=()=>{const s=rd('d');if(!s)return toast('Lengkapi 5 indikator',1);send('saveDiri',{jenis:$('#j').value,...s})};
V.catatan=()=>`<div class="card"><h3>Jurnal & catatan</h3><label>Jenis</label><select id="cj">${opt(['Jurnal harian','Kontrak kolaborasi','Kartu permainan','Observasi industri','Refleksi akhir'])}</select><label>Tahap</label><select id="ct">${opt(TH)}</select><label>Isi</label><textarea id="ci" rows="6" placeholder="Apa kontribusi saya? Apa kendala tim dan bagaimana mengatasinya? Apa yang saya pelajari?"></textarea><button class="btn" onclick="sCat()">Simpan</button></div>
<div class="card"><h3>Catatan saya</h3>${MINE.catatan.map(x=>`<div class="row"><span><b>${esc(x.jenis)}</b> · ${esc(x.tahap)}<br><span class="m">${esc(x.isi)}</span></span></div>`).join('')||'<p class="m">Belum ada catatan.</p>'}</div>`;
const sCat=()=>{const i=$('#ci').value.trim();if(!i)return toast('Isi catatan dulu',1);send('saveCatatan',{jenis:$('#cj').value,tahap:$('#ct').value,isi:i},()=>go('catatan'))};
V.teman=()=>{const t=TIM.filter(x=>x.id!=ME.id);return`<div class="card"><h3>Penilaian teman sebaya</h3><p class="m">Hanya dilihat guru dan admin.</p>${t.length?`<label>Teman</label><select id="tu">${t.map(x=>`<option value="${esc(x.id)}">${esc(x.nama)}</option>`).join('')}</select><label>Putaran</label><select id="tp"><option value="awal">Awal</option><option value="akhir">Akhir</option></select>${sc('t')}<label>Komentar apresiasi / saran</label><textarea id="tk" rows="3"></textarea><button class="btn" onclick="sPeer()">Simpan</button>`:'<p>Anda belum punya anggota kelompok. Hubungi admin.</p>'}</div>`};
const sPeer=()=>{const s=rd('t');if(!s)return toast('Lengkapi 5 indikator',1);send('savePeer',{untuk:$('#tu').value,putaran:$('#tp').value,komentar:$('#tk').value,...s})};
V.rubrik=()=>`<div class="card w"><h3>Rubrik kolaborasi</h3><table><tr><th>Indikator</th><th>4 Sangat Baik</th><th>3 Baik</th><th>2 Cukup</th><th>1 Perlu Bimbingan</th></tr>${KN.map((n,i)=>`<tr><td><b>K${i+1} ${n}</b></td>${CFG.rubrik[i].map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table><p class="m">Predikat: ≥${CFG.ambang[0]} Sangat Baik · ≥${CFG.ambang[1]} Baik · ≥${CFG.ambang[2]} Cukup · di bawahnya Perlu Bimbingan.</p></div>`;
const gsel=()=>GR.length?`<label>Kelompok</label><select id="gk" onchange="fSis()">${GR.map(g=>`<option value="${esc(g.kelompok)}">${esc(g.kelompok)} - ${esc(g.nama)}</option>`).join('')}</select>`:'<p>Belum ada kelompok yang Anda bimbing.</p>';
function fSis(){const g=GR.find(x=>x.kelompok==$('#gk').value);$('#gs').innerHTML='<option value="">Seluruh kelompok</option>'+g.anggota.map(x=>`<option value="${esc(x.id)}">${esc(x.nama)}</option>`).join('')}
V.obs=()=>{setTimeout(()=>GR.length&&fSis());return`<div class="card"><h3>Lembar observasi</h3>${gsel()}<label>Siswa (kosongkan untuk seluruh kelompok)</label><select id="gs"></select><label>Tahap</label><select id="gt">${opt(TH)}</select>${sc('o')}<label>Catatan</label><textarea id="gc" rows="2"></textarea><button class="btn" onclick="sObs()">Simpan</button></div>`};
const sObs=()=>{const s=rd('o');if(!s)return toast('Lengkapi 5 indikator',1);send('saveObs',{kelompok:$('#gk').value,siswa:$('#gs').value,tahap:$('#gt').value,catatan:$('#gc').value,...s})};
V.produk=()=>`<div class="card"><h3>Penilaian produk kelompok</h3>${gsel()}<label>Produk</label><select id="pj">${opt(['Kontrak kolaborasi','Kartu permainan','Lembar temuan','Lembar perbandingan','Laporan kelompok','Seminar'])}</select><label>Skor</label><select id="ps"><option value="4">4 Sangat Baik</option><option value="3">3 Baik</option><option value="2">2 Cukup</option><option value="1">1 Perlu Bimbingan</option></select><label>Catatan</label><textarea id="pc" rows="2"></textarea><button class="btn" onclick="send('saveProduk',{kelompok:$('#gk').value,jenis:$('#pj').value,skor:$('#ps').value,catatan:$('#pc').value})">Simpan</button></div>`;
V.rekap=async()=>{REK=await api('rekap');const ks=[...new Set(REK.map(x=>x.kelompok))].sort();
return`<div class="card"><h3>Rekap kolaborasi</h3><button class="btn" onclick="xl()">Unduh Excel</button><button class="btn g" onclick="wd()">Unduh Word</button><label>Filter kelompok</label><select id="fk" onchange="tb()"><option value="">Semua</option>${opt(ks)}</select><div class="w" id="tb"></div></div><div id="dt"></div>`+(setTimeout(tb),'')};
function tb(){const f=$('#fk').value;$('#tb').innerHTML='<table><tr><th>Nama</th><th>Klp</th><th>Obs</th><th>Teman</th><th>Diri</th><th>Produk</th><th>Nilai</th><th>Predikat</th></tr>'+REK.map((r,i)=>f&&r.kelompok!=f?'':`<tr class="k" onclick="dt(${i})"><td>${esc(r.nama)}</td><td>${esc(r.kelompok)}</td><td>${fmt(r.sk.obs)}</td><td>${fmt(r.sk.peer)}</td><td>${fmt(r.sk.diri)}</td><td>${fmt(r.sk.produk)}</td><td><b>${fmt(r.nilai)}</b></td><td><span class="b" style="background:${PC[r.predikat]}">${r.predikat}</span></td></tr>`).join('')+'</table>'}
function dt(i){const r=REK[i];$('#dt').innerHTML=`<div class="card g2"><div style="text-align:center">${radar(r.ind)}</div><div><h3>${esc(r.nama)}</h3><span class="b" style="background:${PC[r.predikat]}">${r.predikat}</span> <b>${fmt(r.nilai)}</b><p>${esc(r.deskripsi)}</p><p class="m">Jurnal/catatan terkumpul: ${r.jurnal}</p>${KN.map((n,j)=>`<div class="row"><span>${n}</span><b>${fmt(r.ind[j])}</b></div>`).join('')}</div></div>`;$('#dt').scrollIntoView()}
function xl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(REK.map(r=>({NIS:r.id,Nama:r.nama,Kelas:r.kelas,Kelompok:r.kelompok,Observasi:fmt(r.sk.obs),'Teman Sebaya':fmt(r.sk.peer),'Penilaian Diri':fmt(r.sk.diri),Produk:fmt(r.sk.produk),...Object.fromEntries(KN.map((n,i)=>[n,fmt(r.ind[i])])),Nilai:fmt(r.nilai),Predikat:r.predikat,Deskripsi:r.deskripsi}))),'Rekap');XLSX.writeFile(wb,'Rekap_Kolaborasi.xlsx')}
function wd(){const h='<html><head><meta charset="utf-8"></head><body><h2>Rapor Kolaborasi Plant Visit - SMK SMTI Padang</h2>'+REK.map(r=>`<h3>${esc(r.nama)} (${esc(r.id)}) - Kelompok ${esc(r.kelompok)}</h3><p>Nilai ${fmt(r.nilai)} - <b>${r.predikat}</b></p><table border="1" cellpadding="4" style="border-collapse:collapse"><tr>${KN.map(n=>`<th>${n}</th>`).join('')}</tr><tr>${r.ind.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr></table><p>${esc(r.deskripsi)}</p><br style="page-break-after:always">`).join('')+'</body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',h],{type:'application/msword'}));a.download='Rapor_Kolaborasi.doc';a.click()}
V.impor=()=>`<div class="card"><h3>Impor pengguna & kelompok</h3><p class="m">Unduh template, isi sheet <b>Users</b> (id, nama, role admin/guru/siswa, pin, kelompok, kelas) dan <b>Kelompok</b> (kelompok, nama, bus, pembimbing = id guru). Format kolom id dan pin sebagai teks. PIN kosong = PIN sama dengan ID. Data dengan id yang sama akan diperbarui.</p><button class="btn g" onclick="tpl()">Unduh template Excel</button><label style="margin-top:12px">Unggah file Excel terisi</label><input type="file" accept=".xlsx,.xls" onchange="imp(this)"><p id="ir" class="m"></p></div>`;
function tpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{id:'2026001',nama:'Contoh Siswa',role:'siswa',pin:'1234',kelompok:'K01',kelas:'XI TKR 1'},{id:'g001',nama:'Contoh Guru',role:'guru',pin:'1234',kelompok:'',kelas:''}]),'Users');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{kelompok:'K01',nama:'Tim Elang',bus:'Bus 1',pembimbing:'g001'}]),'Kelompok');XLSX.writeFile(wb,'Template_Import_Plant_Visit.xlsx')}
async function imp(i){const f=i.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer()),g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[];
const r=await api('import',{users:g('Users'),kelompok:g('Kelompok')});$('#ir').textContent=`Berhasil: ${r.users} pengguna dan ${r.kelompok} kelompok diimpor.`;toast('Impor selesai')}catch(e){toast(e.message,1)}}
</script>
<script src="setting.js"></script>
</body></html>
